name: Windows build (experimental)

on:
  push:
    branches: [main]
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "windows/src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build the installer (.exe)
        run: npm run tauri -- build

      - uses: actions/upload-artifact@v4
        with:
          name: FocusEdit-windows
          path: |
            windows/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
