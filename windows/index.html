<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FocusEdit</title>
  </head>
  <body>
    <header class="toolbar" data-tauri-drag-region>
      <div class="doc" data-tauri-drag-region>
        <span id="doc-name" class="doc-name">Untitled</span>
        <span id="doc-stats" class="doc-stats"></span>
      </div>
      <nav class="tools" aria-label="Toolbar">
        <button id="btn-new" class="tool" title="New file… (Ctrl+Shift+N)" aria-label="New file">
          <svg viewBox="0 0 20 20"><path d="M5 2.5h6.5l4 4V16a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 16V4A1.5 1.5 0 0 1 5 2.5ZM11 2.5v4.5h4.5M10 9.5v5M7.5 12h5"/></svg>
        </button>
        <button id="btn-open" class="tool" title="Open (Ctrl+O)" aria-label="Open">
          <svg viewBox="0 0 20 20"><path d="M2.5 5.5v9a1.5 1.5 0 0 0 1.5 1.5h11.2a1.5 1.5 0 0 0 1.4-1l1.6-4.6a1 1 0 0 0-.9-1.4H6.6a1.5 1.5 0 0 0-1.4 1L3 15.5M2.5 5.5A1.5 1.5 0 0 1 4 4h3.2l1.6 1.8H14a1.5 1.5 0 0 1 1.5 1.5v1.2"/></svg>
        </button>
        <button id="btn-save" class="tool" title="Save (Ctrl+S)" aria-label="Save">
          <svg viewBox="0 0 20 20"><path d="M4 3.5h9.5l3 3V15a1.5 1.5 0 0 1-1.5 1.5H4A1.5 1.5 0 0 1 2.5 15V5A1.5 1.5 0 0 1 4 3.5Zm2 0V7h6V3.5M5.5 16.5v-5h9v5"/></svg>
        </button>
        <button id="btn-print" class="tool" title="Print or save as PDF (Ctrl+P)" aria-label="Print">
          <svg viewBox="0 0 20 20"><path d="M5.5 7.5V2.5h9v5M5.5 14.5H4A1.5 1.5 0 0 1 2.5 13V9A1.5 1.5 0 0 1 4 7.5h12A1.5 1.5 0 0 1 17.5 9v4a1.5 1.5 0 0 1-1.5 1.5h-1.5M5.5 11.5h9v6h-9z"/></svg>
        </button>
        <button id="btn-file" class="tool" title="Recent files and export" aria-label="Recent files and export" aria-haspopup="menu">
          <svg viewBox="0 0 20 20"><circle cx="4.5" cy="10" r="1.3" class="fill"/><circle cx="10" cy="10" r="1.3" class="fill"/><circle cx="15.5" cy="10" r="1.3" class="fill"/></svg>
        </button>
        <span class="sep" aria-hidden="true"></span>
        <span class="seg" role="group" aria-label="View mode" title="View: edit, split or preview (Ctrl+Shift+V cycles)">
          <button class="tool word" data-view="edit" title="Edit only" aria-label="Edit">Edit</button>
          <button class="tool word" data-view="split" title="Editor and live preview side by side" aria-label="Split">Split</button>
          <button class="tool word" data-view="preview" title="Preview only (Esc returns to editing)" aria-label="Preview">Preview</button>
        </span>
        <button id="btn-outline" class="tool" title="Outline of headings (Ctrl+Shift+O)" aria-label="Outline">
          <svg viewBox="0 0 20 20"><path d="M7.5 5h9M7.5 10h9M7.5 15h9"/><circle cx="3.6" cy="5" r="0.9" class="fill"/><circle cx="3.6" cy="10" r="0.9" class="fill"/><circle cx="3.6" cy="15" r="0.9" class="fill"/></svg>
        </button>
        <span class="sep" aria-hidden="true"></span>
        <button id="btn-focus" class="tool labelled" title="Focus highlighting" aria-label="Focus highlighting">
          <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="6"/><circle cx="10" cy="10" r="1.6" class="fill"/><path d="M10 1.5v3M10 15.5v3M1.5 10h3M15.5 10h3"/></svg>
          <span id="focus-label">Paragraph</span>
        </button>
        <button id="btn-typewriter" class="tool" title="Keep the active line centred (Ctrl+T)" aria-label="Typewriter scrolling">
          <svg viewBox="0 0 20 20"><path d="M3 16 7 4l4 12M4.6 11.5h4.8M14 3.5h3M14 16.5h3M15.5 3.5v13"/></svg>
        </button>
        <span class="sep" aria-hidden="true"></span>
        <button id="btn-theme" class="tool" title="Theme" aria-label="Theme" aria-haspopup="menu">
          <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7"/><path d="M10 3a7 7 0 0 1 0 14Z" class="fill"/></svg>
        </button>
        <button id="btn-size" class="tool" title="Column width" aria-label="Column width">
          <svg viewBox="0 0 20 20"><path d="M3 4.5v11M17 4.5v11M6.5 10h7M6.5 10l2-2M6.5 10l2 2M13.5 10l-2-2M13.5 10l-2 2"/></svg>
        </button>
        <button id="btn-font" class="tool" title="Font" aria-label="Font">
          <svg viewBox="0 0 20 20"><path d="M2.5 15.5 6.5 4.5l4 11M4 11.5h5M15.5 15.5v-5.2a2.3 2.3 0 0 0-4.4-1M12 12.7a2 2 0 1 0 3.5 1.4"/></svg>
        </button>
        <button id="btn-fullscreen" class="tool" title="Full screen (F11)" aria-label="Full screen">
          <svg viewBox="0 0 20 20"><path d="M3.5 7.5v-4h4M16.5 7.5v-4h-4M3.5 12.5v4h4M16.5 12.5v4h-4"/></svg>
        </button>
        <button id="btn-vim" class="tool word" title="Vim mode: learn Vim as you write" aria-label="Vim mode">Vim</button>
        <span class="sep" aria-hidden="true"></span>
        <button id="btn-hints" class="tool" title="Hints and shortcuts (F1)" aria-label="Hints">
          <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5"/><path d="M7.8 7.6a2.3 2.3 0 0 1 4.4.9c0 1.6-2.2 1.9-2.2 3.3"/><circle cx="10" cy="14.4" r=".9" class="fill"/></svg>
        </button>
      </nav>
    </header>
    <div id="goal-bar" class="goal-bar" hidden><div id="goal-fill" class="goal-fill"></div></div>
    <div id="workspace" class="workspace">
      <main id="editor"></main>
      <div id="start" class="start" hidden></div>
      <div id="splitter" class="splitter" role="separator" aria-orientation="vertical" title="Drag to resize · double-click for equal panes" hidden></div>
      <section id="preview" class="preview" tabindex="0" aria-label="Markdown preview" hidden></section>
      <aside id="outline" class="outline" aria-label="Outline" hidden></aside>
    </div>
    <footer id="vim-coach" class="vim-coach" aria-label="Vim coach" hidden></footer>
    <div id="drop-overlay" class="drop-overlay" hidden><span>Drop a file to open it</span></div>
    <div id="print-root" class="preview print-root" aria-hidden="true"></div>
    <div id="palette" class="palette" role="dialog" aria-label="Command palette" hidden>
      <div class="palette-panel">
        <input type="text" spellcheck="false" autocomplete="off" placeholder="Type a command…" aria-label="Command" />
        <ul class="palette-list"></ul>
      </div>
    </div>
    <div id="wizard" class="wizard" role="dialog" aria-label="New file" hidden></div>
    <aside id="hints" class="hints" role="dialog" aria-label="Hints and shortcuts" hidden></aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
